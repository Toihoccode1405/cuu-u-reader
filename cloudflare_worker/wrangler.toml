name = "cuu-u-reader"
main = "src/index.js"
compatibility_date = "2024-04-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "../reader_frontend/dist"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "reder_db"
database_id = "377e84e6-7de8-4f0f-965f-602848fe17b4"

# Bật Cloudflare R2 sau khi kích hoạt dịch vụ R2 trên Cloudflare Dashboard:
# [[r2_buckets]]
# binding = "BUCKET"
# bucket_name = "cuu-u-reader-bucket"
